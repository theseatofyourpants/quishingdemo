<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two identical codes — which is safe?</title>
  <link rel="stylesheet" href="../shared/landing.css">
  <style>
    body { justify-content: flex-start; padding-top: 4vh; }
    .codes {
      display: flex;
      gap: clamp(1.5rem, 6vw, 5rem);
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .code {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .code .label {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 800;
    }
    .code img { width: min(38vw, 340px); }
    .verdict {
      font-size: clamp(1.1rem, 2.6vw, 1.6rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.4em 1em;
      border-radius: 3px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    body.revealed .verdict { opacity: 1; transform: none; }
    .verdict.safe   { background: rgba(20,224,212,0.12); color: var(--cyan);    border: 1px solid rgba(20,224,212,0.45); }
    .verdict.danger { background: rgba(255,46,154,0.14); color: var(--magenta); border: 1px solid rgba(255,46,154,0.45); }
    .controls { margin-top: 2.5rem; }
    .hint { color: var(--muted); font-size: clamp(1rem,2.2vw,1.4rem); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">QR security demo · Demo A</p>
    <h1>Which one is <span class="hl-t">safe</span>?</h1>
    <p class="lede">Two QR codes. One goes to your bank. One does not.
      Vote with your hands.</p>

    <div class="codes">
      <div class="code">
        <div class="label">A</div>
        <img src="assets/code-left.png" alt="QR code A">
        <div class="verdict safe">✓ Safe — your bank</div>
      </div>
      <div class="code">
        <div class="label">B</div>
        <img src="assets/code-right.png" alt="QR code B">
        <div class="verdict danger">✕ Malicious — not your bank</div>
      </div>
    </div>

    <div class="controls">
      <button id="revealBtn" onclick="reveal()">Reveal the answer</button>
      <p class="hint" id="hint">Take the vote first. Then hit reveal.</p>
    </div>
    <p class="foot">Awareness / education material — both codes resolve to the speaker's own domain</p>
  </div>

  <script>
    function reveal() {
      document.body.classList.add('revealed');
      document.getElementById('revealBtn').classList.add('hidden');
      document.getElementById('hint').textContent =
        "Nobody in a 10,000-seat room can tell. Neither can a phone camera.";
    }
    // Press R (or spacebar) to reveal from a clicker.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'r' || e.key === 'R' || e.key === ' ') { e.preventDefault(); reveal(); }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote — which QR is safe?</title>
  <style>
    body { margin:0; min-height:100vh; background:#0b0f1a; color:#eef2ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:6vw; text-align:center; gap:1.5rem; }
    h1 { font-size:2rem; margin:0; }
    p { color:#9aa7c7; margin:0 0 1rem; }
    .choice { width:100%; max-width:420px; display:flex; gap:1rem; }
    button { flex:1; font:inherit; font-weight:800; font-size:2.4rem; color:#0b0f1a;
      border:none; border-radius:18px; padding:1.6rem 0; cursor:pointer; }
    #a { background:#60a5fa; } #b { background:#f59e0b; }
    button:active { transform:translateY(2px); }
    .thanks { display:none; font-size:1.4rem; font-weight:700; }
    .thanks.show { display:block; }
    .foot { margin-top:2rem; font-size:0.75rem; letter-spacing:0.12em;
      text-transform:uppercase; color:#26304a; }
  </style>
</head>
<body>
  <h1>Which QR is safe?</h1>
  <p>Tap your guess.</p>
  <div class="choice" id="buttons">
    <button id="a" onclick="vote('a')">A</button>
    <button id="b" onclick="vote('b')">B</button>
  </div>
  <div class="thanks" id="thanks">Vote counted. Watch the screen. 👀</div>
  <p class="foot">Awareness / education demo</p>

  <script>
    async function vote(choice) {
      try {
        await fetch('/api/vote', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({choice})
        });
      } catch (_) {}
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('thanks').classList.add('show');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote — which QR is safe?</title>
  <style>
    :root { --bg:#06070a; --ink:#ffffff; --muted:#a7b0bc; --cyan:#14e0d4;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:var(--sans);
      background:radial-gradient(700px 420px at 50% -15%, rgba(20,224,212,0.12), transparent 60%), var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:6vw; text-align:center; gap:1.5rem; }
    .brand { position:fixed; top:1.4rem; left:1.5rem; font-weight:800; font-size:0.85rem;
      letter-spacing:0.24em; padding-left:0.6rem; border-left:3px solid var(--cyan); }
    h1 { font-size:2rem; margin:0; text-transform:uppercase; letter-spacing:-0.01em; }
    p { color:var(--muted); margin:0 0 1rem; }
    .choice { width:100%; max-width:420px; display:flex; gap:1rem; }
    button { flex:1; font:inherit; font-weight:800; font-size:2.4rem;
      border:2px solid var(--cyan); border-radius:3px; padding:1.6rem 0; cursor:pointer; }
    #a { background:var(--cyan); color:#06070a; }
    #b { background:transparent; color:var(--cyan); }
    button:active { transform:translateY(2px); }
    .thanks { display:none; font-size:1.4rem; font-weight:800; text-transform:uppercase;
      letter-spacing:0.03em; color:var(--cyan); }
    .thanks.show { display:block; }
    .foot { margin-top:2rem; font-size:0.72rem; letter-spacing:0.18em;
      text-transform:uppercase; color:#4a525f; }
  </style>
</head>
<body>
  <div class="brand">HUNTRESS</div>
  <h1>Which QR is safe?</h1>
  <p>Tap your guess.</p>
  <div class="choice" id="buttons">
    <button id="a" onclick="vote('a')">A</button>
    <button id="b" onclick="vote('b')">B</button>
  </div>
  <div class="thanks" id="thanks">Vote counted. Watch the screen. 👀</div>
  <p class="foot">Awareness / education demo</p>

  <script>
    async function vote(choice) {
      try {
        await fetch('/api/vote', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({choice})
        });
      } catch (_) {}
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('thanks').classList.add('show');
    }
  </script>
</body>
</html>

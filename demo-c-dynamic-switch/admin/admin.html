    :root { --bg:#050707; --ink:#dfe5e5; --muted:#93a2a2; --cyan:#00d8e5;
      --lime:#7ee500; --magenta:#ff009d;
      --display:"Archivo","Arial Black",system-ui,sans-serif;
      --sans:"Funnel Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:var(--sans);
      background:radial-gradient(700px 420px at 50% -15%, rgba(20,224,212,0.10), transparent 60%), var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:6vw; text-align:center; gap:1.2rem; }
    .brand { position:fixed; top:1.4rem; left:1.5rem; font-weight:800; font-size:0.85rem;
      letter-spacing:0.24em; padding-left:0.6rem; border-left:3px solid var(--cyan); }
    h1 { font-family:var(--display); font-weight:900; font-size:1.6rem; margin:0;
      line-height:0.85; text-transform:uppercase; letter-spacing:0; }
    .state { font-size:1.1rem; color:var(--muted); }
    .state b { color:var(--ink); font-family:var(--mono); }
    .toggle { width:100%; max-width:460px; display:flex; flex-direction:column; gap:1rem; margin-top:1rem; }
    button { font:inherit; font-weight:800; font-size:1.4rem; color:#06070a;
      text-transform:uppercase; letter-spacing:0.03em;
      border:none; border-radius:3px; padding:1.4rem; cursor:pointer;
      opacity:0.5; transition:opacity .15s, transform .08s; }
    button.active { opacity:1; box-shadow:0 0 0 3px var(--cyan) inset; }
    button:active { transform:translateY(2px); }
    #benign  { background:var(--cyan); }
    #swapped { background:var(--magenta); color:#ffffff; }
    .url { font-family:var(--mono); font-size:0.95rem; color:var(--cyan); word-break:break-all; }
    .err { color:var(--magenta); min-height:1.2em; }
    .foot { margin-top:1.5rem; font-size:0.72rem; letter-spacing:0.18em;
      text-transform:uppercase; color:#4a525f; }
  </style>
</head>
<body>
  <div class="brand">HUNTRESS</div>
  <h1>Dynamic-QR toggle</h1>
  <div class="state">Slug <b id="slug">…</b> currently points at
    <b id="current">…</b></div>
  <div class="url" id="url"></div>

  <div class="toggle">
    <button id="benign"  onclick="setTarget('benign')">Benign — event schedule</button>
    <button id="swapped" onclick="setTarget('swapped')">Swap — "destination changed"</button>
  </div>
  <div class="err" id="err"></div>
  <p class="foot">Awareness / education demo · keep this URL + token private</p>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const H = {'Content-Type': 'application/json', 'X-Admin-Token': token};

    async function refresh() {
      try {
        const r = await fetch('/admin/state', {headers: {'X-Admin-Token': token}});
        if (!r.ok) throw new Error('auth failed (check ?token=)');
        const s = await r.json();
        document.getElementById('slug').textContent = s.slug;
        document.getElementById('current').textContent = s.current;
        document.getElementById('url').textContent = '→ ' + s.url;
        document.getElementById('benign').classList.toggle('active', s.current === 'benign');
        document.getElementById('swapped').classList.toggle('active', s.current === 'swapped');
        document.getElementById('err').textContent = '';
      } catch (e) {
        document.getElementById('err').textContent = e.message;
      }
    }

    async function setTarget(target) {
      try {
        const r = await fetch('/admin/set', {method:'POST', headers:H,
          body: JSON.stringify({target})});
        if (!r.ok) throw new Error('set failed');
        await refresh();
      } catch (e) {
        document.getElementById('err').textContent = e.message;
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
